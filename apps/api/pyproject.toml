[project]
name = "pharmacy-api"
version = "0.1.0"
description = "API for the pharmacy management system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "PyJWT>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]